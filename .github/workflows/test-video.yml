name: Generate Premium Hindi News Test Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Generate test-only Short
        env:
          HINDI_VOICE: hi-IN-MadhurNeural
          HINDI_VOICE_RATE: -8%
        run: python main.py
      - name: Upload review package (no publishing)
        uses: actions/upload-artifact@v4
        with:
          name: premium-hindi-short-review
          path: output/
          if-no-files-found: error
          retention-days: 14
