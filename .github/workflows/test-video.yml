name: Generate Test Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Generate video (no publishing)
        run: python main.py
      - name: Save video for review
        uses: actions/upload-artifact@v4
        with:
          name: hindi-short-test
          path: output/
          if-no-files-found: error
          retention-days: 7
